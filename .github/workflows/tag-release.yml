on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "self test"
    branches:
      - main
    types:
      - completed

jobs:
  tag-release:
    runs-on: ubuntu-latest
    name: "Tag new version"
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
      - name: Show calculated tag
        run: |
          echo "new_tag=${{ steps.tag.outputs.new_tag }}"
          echo "new_version=${{ steps.tag.outputs.new_version }}"
          echo "release_type=${{ steps.tag.outputs.release_type }}"